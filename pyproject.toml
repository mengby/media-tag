[build-system]
requires = ["setuptools==81.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-tag"
version = "0.1.0"
description = "Local media catalogue, immutable storage and contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
media-tag = "media_tag.contracts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
