[build-system]
requires = ["setuptools==81.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "media-tag"
version = "0.2.0"
description = "Local media catalogue, immutable storage and contracts"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.3", "Pillow==13.0.0", "fastapi==0.162.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
publish = ["media-contracts==0.2.0", "httpx==0.28.1"]
sync = ["media-contracts==0.2.0", "httpx==0.28.1"]
dev = ["pytest==9.2.0", "httpx==0.28.1"]
editing = ["av==16.0.1"]
mcp = ["mcp==2.3.0"]
text = ["torch==2.9.1+cu128", "transformers==4.57.6", "psutil==7.1.3", "msvc-runtime==14.51.36231; sys_platform == 'win32'"]
semantic-fetch = ["huggingface-hub==0.36.2", "hf-xet==1.2.0"]
semantic = ["torch==2.9.1+cu128", "torchvision==0.24.1+cu128", "transformers==4.57.6", "accelerate==1.12.0", "msvc-runtime==14.51.36231; sys_platform == 'win32'"]
vision = ["torch==2.9.1+cu128", "transformers==4.57.6", "rapidocr==3.9.2", "onnxruntime==1.23.2",
          "opencv-python==4.12.0.88", "numpy==2.2.6", "psutil==7.1.3", "msvc-runtime==14.51.36231; sys_platform == 'win32'"]

[project.scripts]
media-tag = "media_tag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"media_tag.workers" = ["media-tools.lock.json"]
"media_tag.models" = ["models.lock.json"]
"media_tag.semantic" = ["model.lock.json"]
"media_tag.web" = ["*.html", "*.js", "*.css"]
"media_tag.terminology.embedding" = ["bge.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
